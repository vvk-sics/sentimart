{% extends './base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>E-commerce Assistant</h3>
        </div>
        <div class="card-body" style="height: 400px; overflow-y: auto; display: flex; flex-direction: column;" id="chat-messages">
            <!-- Messages will appear here -->
        </div>
        <div class="card-footer">
            <div class="input-group">
                <input type="text" class="form-control" id="user-input" 
                       placeholder="Ask about your order or products..." autocomplete="off">
                <div class="input-group-append">
                    <button class="btn btn-primary" id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    
    function addMessage(message, isBot) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `mb-2 p-2 rounded ${isBot ? 'bg-light text-dark' : 'bg-primary text-white float-end'}`;
        messageDiv.style.maxWidth = '70%';
        messageDiv.style.whiteSpace = 'pre-line';
        messageDiv.textContent = message;
        
        if (isBot) {
            messageDiv.classList.add('float-start');
        }
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;
        
        addMessage(message, false);
        userInput.value = '';
        
        fetch('/chat/api/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({message: message})
        })
        .then(response => response.json())
        .then(data => {
            if (data.response) {
                addMessage(data.response, true);
            }
        })
        .catch(error => {
            addMessage("Sorry, I'm having trouble connecting. Please try again later.", true);
        });
    }
    
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    // Initial bot greeting
    addMessage("Hello! I'm your shopping assistant. How can I help you today?", true);
});
</script>

<style>
#chat-messages {
    background-color: #f8f9fa;
    padding: 15px;
    border-radius: 5px;
}
</style>
{% endblock %}
