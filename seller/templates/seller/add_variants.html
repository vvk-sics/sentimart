{% extends 'seller_base.html' %}

{% block content %}
</aside>
<div class="bg-white rounded-lg p-6 w-full max-w-5xl shadow-md">
    <h2 class="text-xl font-bold text-gray-700 mb-4">Add Variant for {{ product.name }}</h2>
{% if messages %}
    <ul class="mt-4 text-green-600">
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}
<form method="post">
    {% csrf_token %}

    {% for attribute in attribute_groups %}
        <div class="mb-4">
            <label class="block text-gray-700 mb-1">{{ attribute.name }}</label>
            <select name="attribute_values" class="border w-full p-2 rounded" required>
                <option value="">-- Select {{ attribute.name }} --</option>
                {% for value in attribute.values.all %}
                    <option value="{{ value.id }}">{{ value.value }}</option>
                {% endfor %}
            </select>
        </div>
    {% endfor %}

    <div class="mb-4">
        <label class="block text-gray-700">Price</label>
        <input type="text" name="price" class="border p-2 w-full rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">Stock</label>
        <input type="number" name="stock" class="border p-2 w-full rounded" required>
    </div>

    <button class="bg-green-600 text-white p-2 rounded hover:bg-green-700">Add Variant</button>
</form>

</div>
{% endblock %}
